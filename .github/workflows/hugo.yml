name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.146.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Meldet nach jedem Deploy alle URLs aus der Sitemap an IndexNow
  # (Bing, Yandex, Seznam, Naver; Bing speist auch DuckDuckGo, Ecosia und
  # die Websuche von ChatGPT/Copilot). Der Schluessel ist kein Geheimnis:
  # er liegt absichtlich oeffentlich unter /<key>.txt (static/).
  # Ein Fehler hier bricht den Deploy nicht ab.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    env:
      INDEXNOW_KEY: 973810246429440551d47866ec2ee278
      SITE: https://blog.depottax.at
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          sleep 30
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          test -n "$urls"
          json=$(printf '%s\n' $urls | jq -R . | jq -s --arg k "$INDEXNOW_KEY" --arg s "$SITE" \
            '{host: "blog.depottax.at", key: $k, keyLocation: ($s + "/" + $k + ".txt"), urlList: .}')
          echo "$(printf '%s\n' $urls | wc -l) URLs"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$json" https://api.indexnow.org/indexnow
